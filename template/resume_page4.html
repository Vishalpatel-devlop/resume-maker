{% load static %}
<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'bootstrap5.css' %}">
    <link rel="stylesheet" href="{% static 'r_page4.css' %}">
<link rel="stylesheet" href="{% static 'https://unpkg.com/aos@next/dist/aos.css' %}" />
</head>
<body>
    <form action="{% url 'exp' %}" method="post">
        {% csrf_token %}
    <div class="container2 container-fluid align-content-center">
    
    <div class="row">
        <div id="head" class="col-md-6 offset-md-3" data-aos="fade-right" data-aos-duration="1500">Experience Informations</div>
        <div class="col-md-6 offset-md-3 col-sm">
        
        <div class="form-group">
            
            <input type="text" class="form-control form-control-md input1" id="inputField" required name="job">
            <label class="label">Job Title</label>
           
            </div>
            
           <div class="form-group">
            
            <input type="text" class="form-control form-control-md input1" id="inputField" required name="cname">
            <label class="label">Company's Name</label>
            
            </div>
            <div class="form-group">
            
            <input type="text" class="form-control form-control-md input1" id="inputField" required name="achieve">
            <label class="label">Achievement</label>
            
            </div>
            
            
           <div class="form-group row">
            
            <div class="col"><input type="text" class="form-control input1" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required name="jdate">
            <label class="label">Date of joining</label>
            </div>
            <div class="col"><input type="text" class="form-control input1" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required name="tdate">
            <label class="label">Termination Date</label>
            </div>
            
            </div>
            
            
           
                <button class="btn btn-primary offset-md-9 offset-sm-10 offset-lg-10 offset-xxl-10" type="submit" data-aos="fade-left" data-aos-duration="1500">Submit</button>
        </div>
        
        
        
        </div>
    
    
    
    
    
    
    
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({
        offset:2,
    });
      
     
   
  </script>
    </form>
    </body>
