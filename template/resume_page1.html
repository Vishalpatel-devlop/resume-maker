{% load static %}
<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'bootstrap5.css' %}">
    <link rel="stylesheet" href="{% static 'r_page1.css' %}">
<link rel="stylesheet" href="{% static 'https://unpkg.com/aos@next/dist/aos.css' %}">
</head>
<body>
    <form action="{% url 'personal' %}" method="post">
       {% csrf_token %}
    <div class="container1 container-fluid align-content-center">
    
    <div class="row">
        <div id="head" class="col-md-6 offset-md-3" data-aos="fade-right" data-aos-duration="1500">Personal Informations</div>
        <div class="col-md-3 offset-md-3 col-sm">
        
        <div class="form-group">
            
            <input type="text" class="form-control form-control-md input1 mt-5" required name="first_name">
            
            <label class="label">First Name</label>
            </div>
            
            
        <div class="form-group">
            <input type="text" class="form-control form-control-md mt-5" required name="last_name">
            <label class="label">Last Name</label>
            </div>
        
         <div class="form-group">
            <input type="number" class="form-control form-control-md mt-5" required name="contact">
            <label class="label">Contact number</label>
            </div>
            
        <div class="form-group">
            <input type="text" class="form-control form-control-md mt-5" required name="mail">
            <label class="label">Email Address</label>
            </div>
        </div>
            
            <div class="col-md-3 col-sm col-xs-3 ">
         <div class="form-group">
            <input type="text" class="form-control form-control-md input1 mt-5" required name="location">
            <label class="label">Location</label>
            </div>
        
        <div class="form-group">
            <input type="text" class="form-control form-control-md mt-5" required name="LinkedIn">
            <label class="label">LinkedIn Profile</label>
            </div>
        
        <div class="form-group">
            <input type="text" class="form-control input1" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required name="d.o.b">
            
            <label class="label">D.O.B</label>
            </div>
        
        <div class="form-group">
            <input type="text" class="form-control form-control-md mt-5" required name="objective">
            <label class="label">Objective</label>
            </div>
                <button class="btn btn-primary offset-md-6 offset-sm-8 offset-lg-8 offset-xxl-9" type="submit" data-aos="fade-right" data-aos-duration="1500" id="button">Submit</button>
        </div>
        
        
        
        
        </div>
    
    
    
    
    
    
    
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({
        offset:2,
    });
  </script>
  </form>
    </body>
